<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <g id="temis" transform="translate(200 120) scale(1.5) translate(-200 -120)">

    <!-- CABEÇA & VENDA -->
    <g id="head">
      <!-- Cabelo / Cabeça -->
      <path d="M 188 65 C 188 52, 212 52, 212 65 C 212 75, 188 75, 188 65 Z" fill="#263D50" />
      <!-- Rosto -->
      <path d="M 192 65 C 192 78, 208 78, 208 65 Z" fill="#F3EFE6" />
      <!-- Venda -->
      <rect x="189" y="60" width="22" height="6" rx="2" fill="#D8B9A8" stroke="#263D50" stroke-width="1.5" />
    </g>

    <!-- CORPO / VESTIDO (Silhueta Geométrica) -->
    <g id="body">
      <!-- Pescoço -->
      <rect x="197" y="74" width="6" height="10" fill="#F3EFE6" />
      
      <!-- VESTIDO / MANTOL -->
      <path d="M 190 84 
           L 210 84 
           L 225 150 
           C 210 165, 190 165, 175 150 
           Z" fill="#B9C9D0" stroke="#263D50" stroke-width="4" stroke-linejoin="round" />
      <!-- Dobras fluidas do vestido (Inspiradas nas curvas de Copacabana) -->
      <path d="M 190 84 C 195 110, 185 130, 180 152" stroke="#263D50" stroke-width="2" stroke-dasharray="2 2" />
      <path d="M 210 84 C 205 110, 215 130, 220 152" stroke="#263D50" stroke-width="2" />
    </g>

    <!-- BRAÇOS & BALANÇA -->
    <g id="scale-and-arms">
      <!-- Braço Esquerdo (Sustentando a Balança) -->
      <path d="M 190 90 L 160 100 L 150 95" stroke="#263D50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Braço Direito (Postura simétrica/equilibrada) -->
      <path d="M 210 90 L 240 100 L 250 95" stroke="#263D50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Travessão da Balança -->
      <line x1="120" y1="95" x2="280" y2="95" stroke="#263D50" stroke-width="3" stroke-linecap="round" />

      <!-- Fixo Central do Travessão -->
      <circle cx="200" cy="95" r="4" fill="#D8B9A8" stroke="#263D50" stroke-width="1.5" />

      <!-- PRATO ESQUERDO -->
      <g id="scale-left">
        <!-- Correntes -->
        <line x1="125" y1="95" x2="110" y2="130" stroke="#263D50" stroke-width="1.5" />
        <line x1="145" y1="95" x2="140" y2="130" stroke="#263D50" stroke-width="1.5" />
        <!-- Prato -->
        <path d="M 105 130 Q 125 142 145 130 Z" fill="#C5CEBA" stroke="#263D50" stroke-width="2.5" />
      </g>

      <!-- PRATO DIREITO -->
      <g id="scale-right">
        <!-- Correntes -->
        <line x1="255" y1="95" x2="260" y2="130" stroke="#263D50" stroke-width="1.5" />
        <line x1="275" y1="95" x2="290" y2="130" stroke="#263D50" stroke-width="1.5" />
        <!-- Prato -->
        <path d="M 255 130 Q 275 142 295 130 Z" fill="#C5CEBA" stroke="#263D50" stroke-width="2.5" />
      </g>
    </g>

    <!-- BASE (Alinhamento de sustentação) -->
    <g id="pedestal">
      <!-- Bloco Superior -->
      <path d="M 170 160 H 230 L 235 175 H 165 Z" fill="#D8D0B5" stroke="#263D50" stroke-width="3" stroke-linejoin="round" />
      <!-- Bloco Inferior (Conecta visualmente com a base do monitor) -->
      <rect x="155" y="175" width="90" height="12" rx="3" fill="#F3EFE6" stroke="#263D50" stroke-width="3" />
    </g>

  </g>
</svg>